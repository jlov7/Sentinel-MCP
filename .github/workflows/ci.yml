name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    name: v2 Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin-console/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e packages/policy_engine/python
          pip install -e packages/provenance
          pip install -e apps/control-plane[dev]
      - name: Install admin-console dependencies
        working-directory: apps/admin-console
        run: npm ci
      - name: Run release gate
        run: make v2-release-gate
      - name: Upload release-gate report
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-v2-release-gate-report
          path: apps/control-plane-v2/eval/reports/latest.json

  rust-v2:
    name: Rust v2 Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust fmt
        working-directory: apps/control-plane-v2
        run: cargo fmt -- --check
      - name: Rust clippy
        working-directory: apps/control-plane-v2
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        working-directory: apps/control-plane-v2
        run: cargo test

  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e packages/policy_engine/python
          pip install -e packages/provenance
          pip install -e apps/control-plane[dev]
      - name: Run linters
        run: |
          . .venv/bin/activate
          make lint
      - name: Run backend tests
        run: |
          . .venv/bin/activate
          pytest --cov=sentinel_control_plane --cov=sentinel_policy --cov=sentinel_provenance --cov-report=term

  frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin-console/package-lock.json
      - name: Install dependencies
        working-directory: apps/admin-console
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: apps/admin-console
        run: npx playwright install --with-deps chromium
      - name: Frontend release gate
        working-directory: apps/admin-console
        run: npm run release:gate
      - name: Upload frontend release-gate report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-gate-report
          path: apps/admin-console/reports/frontend-release-gate.json

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
      - name: Build documentation
        run: mkdocs build --strict
