site_name: Sentinel MCP Docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Overview: index.md
  - Demo Walkthrough: demo.md
  - Technical Guides:
      - Architecture: technical/architecture.md
      - Architecture v2 (Rust): technical/architecture-v2.md
      - Setup & Deployment: technical/setup.md
      - Testing Strategy: technical/testing.md
  - Reference:
      - v2 API: reference/api-v2.md
      - Release Gate: reference/release-gate.md
  - Operations:
      - Runbooks: operations/runbooks.md
      - Security & Compliance: operations/security.md
  - Governance:
      - Executive Brief: governance/executive.md
      - Policy Playbook: governance/policy-playbook.md
  - Plans:
      - 2026-03-02 v2 Initial Implementation: plans/2026-03-02-sentinel-v2-initial-implementation.md
      - 2026-03-03 Frontier Gap Closure: plans/2026-03-03-sentinel-v2-frontier-gap-closure.md
      - 2026-03-03 Frontier Tranche 2: plans/2026-03-03-sentinel-v2-frontier-tranche-2.md
      - 2026-03-03 Documentation Overhaul: plans/2026-03-03-repo-documentation-world-class-overhaul.md
  - Appendix:
      - Glossary: appendix/glossary.md
      - FAQ: appendix/faq.md
