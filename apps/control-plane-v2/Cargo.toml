[package]
name = "sentinel-control-plane-v2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sentinel MCP v2 frontier governance control plane"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonwebtoken = "8.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
opentelemetry = "0.28"
opentelemetry_sdk = "0.28"
opentelemetry-otlp = "0.28"
tracing-opentelemetry = "0.29"
sigstore-sign = { version = "0.6.3", default-features = false, features = ["rustls"] }
sigstore-verify = { version = "0.6.3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
